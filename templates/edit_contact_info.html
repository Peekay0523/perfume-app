{% extends "base.html" %}

{% block title %}Edit Contact Information - Essence{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8">
    <h1 class="text-3xl font-serif-display font-bold text-slate-900 mb-8">Edit Contact Information</h1>

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="address" class="block text-sm font-medium text-slate-700 mb-1">Address</label>
                    <input type="text" id="address" name="address" value="{{ contact_info.address|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
                
                <div>
                    <label for="city" class="block text-sm font-medium text-slate-700 mb-1">City</label>
                    <input type="text" id="city" name="city" value="{{ contact_info.city|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
                
                <div>
                    <label for="state" class="block text-sm font-medium text-slate-700 mb-1">State</label>
                    <input type="text" id="state" name="state" value="{{ contact_info.state|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
                
                <div>
                    <label for="zip_code" class="block text-sm font-medium text-slate-700 mb-1">ZIP Code</label>
                    <input type="text" id="zip_code" name="zip_code" value="{{ contact_info.zip_code|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="email" name="email" value="{{ contact_info.email|default:'' }}" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
            </div>
            
            <div>
                <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ contact_info.phone|default:'' }}" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
            </div>

            <div class="flex space-x-4 pt-4">
                <button type="submit" class="px-6 py-3 bg-gradient-to-r from-rose-600 to-rose-700 text-white font-semibold rounded-lg hover:shadow-lg transition-shadow">
                    Update Contact Info
                </button>
                <a href="{% url 'admin_dashboard' %}" class="px-6 py-3 bg-slate-200 text-slate-700 font-semibold rounded-lg hover:bg-slate-300 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
