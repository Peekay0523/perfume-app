{% extends "base.html" %}

{% block title %}Edit Banking Details - Essence{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8">
    <h1 class="text-3xl font-serif-display font-bold text-slate-900 mb-8">Edit Banking Details</h1>

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="bank_name" class="block text-sm font-medium text-slate-700 mb-1">Bank Name</label>
                    <input type="text" id="bank_name" name="bank_name" value="{{ banking_details.bank_name|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
                
                <div>
                    <label for="branch_name" class="block text-sm font-medium text-slate-700 mb-1">Branch Name</label>
                    <input type="text" id="branch_name" name="branch_name" value="{{ banking_details.branch_name|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
                
                <div>
                    <label for="branch_code" class="block text-sm font-medium text-slate-700 mb-1">Branch Code</label>
                    <input type="text" id="branch_code" name="branch_code" value="{{ banking_details.branch_code|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
                
                <div>
                    <label for="swift_code" class="block text-sm font-medium text-slate-700 mb-1">SWIFT Code</label>
                    <input type="text" id="swift_code" name="swift_code" value="{{ banking_details.swift_code|default:'' }}" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
                </div>
            </div>
            
            <div>
                <label for="account_holder_name" class="block text-sm font-medium text-slate-700 mb-1">Account Holder Name</label>
                <input type="text" id="account_holder_name" name="account_holder_name" value="{{ banking_details.account_holder_name|default:'' }}" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
            </div>
            
            <div>
                <label for="account_number" class="block text-sm font-medium text-slate-700 mb-1">Account Number</label>
                <input type="text" id="account_number" name="account_number" value="{{ banking_details.account_number|default:'' }}" 
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">
            </div>

            <div>
                <label for="reference_instruction" class="block text-sm font-medium text-slate-700 mb-1">Reference Instruction</label>
                <textarea id="reference_instruction" name="reference_instruction" rows="3"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-rose-500">{{ banking_details.reference_instruction|default:'Use your order number as reference' }}</textarea>
            </div>

            <div class="flex space-x-4 pt-4">
                <button type="submit" class="px-6 py-3 bg-gradient-to-r from-rose-600 to-rose-700 text-white font-semibold rounded-lg hover:shadow-lg transition-shadow">
                    Update Banking Details
                </button>
                <a href="{% url 'admin_dashboard' %}" class="px-6 py-3 bg-slate-200 text-slate-700 font-semibold rounded-lg hover:bg-slate-300 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
