<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Essence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'serif-display': ['Playfair Display', 'serif'],
              'sans': ['Inter', 'sans-serif']
            }
          }
        }
      }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-rose-50/30 to-amber-50/20 font-sans">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-slate-900 mb-2 font-serif-display">
                        Forgot Password?
                    </h1>
                    <p class="text-slate-600">
                        Enter your username or email address and we'll send you a link to reset your password.
                    </p>
                </div>

                {% if messages %}
                <div class="mb-6">
                    {% for message in messages %}
                    <div class="p-3 bg-{{ message.tags }}-100 text-{{ message.tags }}-700 rounded-lg text-sm mb-2">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                <form method="post" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label for="username_or_email" class="block text-sm font-medium text-slate-700 mb-1">
                            Username or Email
                        </label>
                        <input
                            type="text"
                            id="username_or_email"
                            name="username_or_email"
                            required
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                            placeholder="Enter your username or email"
                        >
                    </div>

                    <button
                        type="submit"
                        class="w-full py-3 px-4 bg-gradient-to-r from-rose-600 to-rose-700 text-white font-semibold rounded-lg hover:shadow-lg transition-shadow"
                    >
                        Send Reset Instructions
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-slate-600 text-sm">
                        <a href="{% url 'auth_page' %}?mode=login" class="text-rose-600 font-semibold hover:underline">
                            Back to Sign In
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
