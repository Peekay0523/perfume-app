{% extends "base.html" %}

{% block title %}Account Settings - Essence{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-serif-display font-bold text-slate-900 mb-6">Account Settings</h1>
        
        {% if messages %}
        <div class="mb-6">
            {% for message in messages %}
            <div class="p-4 mb-4 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-100 text-red-700{% elif message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        <div class="bg-white rounded-lg shadow-md p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="first_name" class="block text-sm font-medium text-slate-700 mb-1">First Name</label>
                        <input type="text" id="first_name" name="first_name" 
                               value="{{ user.first_name }}"
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="last_name" class="block text-sm font-medium text-slate-700 mb-1">Last Name</label>
                        <input type="text" id="last_name" name="last_name" 
                               value="{{ user.last_name }}"
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">
                    </div>
                </div>
                
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" 
                           value="{{ user.username }}"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" 
                           value="{{ user.email }}"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">
                </div>
                
                <div class="pt-4 border-t border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-900 mb-4">Change Password</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="current_password" class="block text-sm font-medium text-slate-700 mb-1">Current Password</label>
                            <input type="password" id="current_password" name="current_password"
                                   class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                                   placeholder="Enter your current password if changing password">
                        </div>
                        
                        <div>
                            <label for="new_password" class="block text-sm font-medium text-slate-700 mb-1">New Password</label>
                            <input type="password" id="new_password" name="new_password"
                                   class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                                   placeholder="Leave blank if not changing password">
                        </div>
                        
                        <div>
                            <label for="confirm_new_password" class="block text-sm font-medium text-slate-700 mb-1">Confirm New Password</label>
                            <input type="password" id="confirm_new_password" name="confirm_new_password"
                                   class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"
                                   placeholder="Confirm your new password">
                        </div>
                    </div>
                </div>
                
                <div class="pt-6">
                    <button type="submit" class="w-full px-4 py-3 bg-rose-600 text-white font-semibold rounded-lg hover:bg-rose-700 transition-colors">
                        Update Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
